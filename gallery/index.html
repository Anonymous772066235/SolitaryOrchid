<figure data-year="2014" data-full="../Pages/drawing/images/01-small.jpg" data-caption="眸 · 2014年7月7日作，我很喜欢的一张。"><img src="../Pages/drawing/images/01-small.jpg" alt="眸" loading="lazy"><figcaption>眸 · 2014</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/04-small.jpg" data-caption="鹅 · 2019年5月27日作，为校园活动画的一组风景简笔画之一，画的是湖里的黑天鹅。"><img src="../Pages/drawing/images/04-small.jpg" alt="鹅" loading="lazy"><figcaption>鹅 · 2019</figcaption></figure><figure data-year="" data-full="../Pages/drawing/images/02-small.jpg" data-caption="纳兹 · 纳兹是《妖精的尾巴》的男主。早年用光盘看过一部分，很久以后又从头补了起来，共300多集。"><img src="../Pages/drawing/images/02-small.jpg" alt="纳兹" loading="lazy"><figcaption>纳兹 · </figcaption></figure><figure data-year="2017" data-full="../Pages/drawing/images/05-small.jpg" data-caption="鹿 · 2017年12月16日作。为校园日历活动画的插画之一，画的是校园里的梅花鹿"><img src="../Pages/drawing/images/05-small.jpg" alt="鹿" loading="lazy"><figcaption>鹿 · 2017</figcaption></figure><figure data-year="" data-full="../Pages/drawing/images/06-small.jpg" data-caption="福达 · 我挺想它的。。。"><img src="../Pages/drawing/images/06-small.jpg" alt="福达" loading="lazy"><figcaption>福达 · </figcaption></figure><figure data-year="2017" data-full="../Pages/drawing/images/07-small.jpg" data-caption="小龙女 · 2017年11月08日作。第一次看到她是在《神雕侠侣》里从小就觉得她好看，而且气质上佳。斯人若彩虹，遇上方知有。"><img src="../Pages/drawing/images/07-small.jpg" alt="小龙女" loading="lazy"><figcaption>小龙女 · 2017</figcaption></figure><figure data-year="2018" data-full="../Pages/drawing/images/08-small.jpg" data-caption="歌手 · 2018年4月29日作。曾经很喜欢的一首歌的歌手，名字没记，歌当然也早就忘了"><img src="../Pages/drawing/images/08-small.jpg" alt="歌手" loading="lazy"><figcaption>歌手 · 2018</figcaption></figure><figure data-year="2018" data-full="../Pages/drawing/images/09-small.jpg" data-caption="雪碧 · 2018年10月02日。最喜欢的碳酸饮料，没有之一。"><img src="../Pages/drawing/images/09-small.jpg" alt="雪碧" loading="lazy"><figcaption>雪碧 · 2018</figcaption></figure><figure data-year="2018" data-full="../Pages/drawing/images/10-small.jpg" data-caption="杀手 · 2018年05月31日作。电影《这个杀手不太冷》，跟《肖生克的救赎》一样好看，佩服里昂和安迪。“人生总是如此艰难吗，还是只有童年如此？”"><img src="../Pages/drawing/images/10-small.jpg" alt="杀手" loading="lazy"><figcaption>杀手 · 2018</figcaption></figure><figure data-year="2018" data-full="../Pages/drawing/images/11-small.jpg" data-caption="试验品 · 2018年06月26日作。画的是贾斯汀—比伯，突发奇想地把阴影空出来，涂上高光部分，再用PS调整过来，前前后后改了好久，满有意思的。"><img src="../Pages/drawing/images/11-small.jpg" alt="试验品" loading="lazy"><figcaption>试验品 · 2018</figcaption></figure><figure data-year="2015" data-full="../Pages/drawing/images/03-small.jpg" data-caption="大卫 · 2015年08月12日，想学素描的人大概都画过大卫。那么多年过去，素描还是没学会，但画画的爱好一直没丢。"><img src="../Pages/drawing/images/03-small.jpg" alt="大卫" loading="lazy"><figcaption>大卫 · 2015</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/12-small.jpg" data-caption="猫 · 2019年5月25日作。记得小学有篇课文讲画杨桃，从正面看是一个五角星，要看到什么就画什么，不能想当然。这是一只黑猫，我只看到那么多。"><img src="../Pages/drawing/images/12-small.jpg" alt="猫" loading="lazy"><figcaption>猫 · 2019</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/13-small.jpg" data-caption="玛蒂尔达 · 2019年06月13日作。《这个杀手不太冷》女主 Matilda 。"><img src="../Pages/drawing/images/13-small.jpg" alt="玛蒂尔达" loading="lazy"><figcaption>玛蒂尔达 · 2019</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/14-small.jpg" data-caption="神仙姐姐 · 2019年5月12日作。好看就完事了，当然，照片肯定比画好看，人肯定比照片好看。"><img src="../Pages/drawing/images/14-small.jpg" alt="神仙姐姐" loading="lazy"><figcaption>神仙姐姐 · 2019</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/15-small.jpg" data-caption="荷 · 2019年06月24日作。夏日的荷，开的时候美极了。"><img src="../Pages/drawing/images/15-small.jpg" alt="荷" loading="lazy"><figcaption>荷 · 2019</figcaption></figure><figure data-year="2019" data-full="../Pages/drawing/images/16-small.jpg" data-caption="多肉 · 2019年08月06日作。我之前我好几株多肉，元旦的时候买的，可惜的是，画完不久，我的多肉就死了大半了（熬过的严寒没挺过酷暑），现在所剩无几，这一盆只剩下一株了。。。就是左前方叶片最多的那株。"><img src="../Pages/drawing/images/16-small.jpg" alt="多肉" loading="lazy"><figcaption>多肉 · 2019</figcaption></figure>
    </div>
